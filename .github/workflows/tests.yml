name: Tests

# Se dispara ante CUALQUIER Pull Request, sin filtrar por rama destino.
#
# La version anterior filtraba por 'branches: [main]', de modo que solo los
# PR hacia main mostraban Checks. Funcionaba mientras cada sprint entraba en
# un unico PR, y dejo de funcionar en el Sprint 3, cuando la metodologia paso
# a un issue -> una rama -> un PR: los siete PR encadenados apuntan a su
# predecesor, ninguno apunta a main, y los siete aparecian con "0 Checks".
#
# El trigger de push sobre develop no cubre ese caso: se dispara al integrar,
# y su resultado queda asociado al commit de develop, no al Pull Request donde
# se revisa. La evidencia tiene que estar donde ocurre la revision.
#
# Si cada issue tiene su PR, cada PR ensena su suite.
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    name: Suite de pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # 3.11 y no 3.12: es la version del entorno de desarrollo del equipo.
      # Un CI que prueba una version distinta a la que se corre localmente
      # es una fuente de discrepancias gratuita.
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No se configura ningun secret de GCP a proposito. Toda la suite
      # usa mocks y no toca Vertex AI, Firestore ni ChromaDB: es una
      # consecuencia directa del cliente perezoso de Firestore (#10) y de
      # que vertexai.init() no autentica al importar. Si este paso empieza
      # a requerir credenciales, es senal de que una prueba dejo de estar
      # aislada.
      - name: Ejecutar suite de pruebas
        run: python -m unittest discover -s tests -p "test_*.py" -v